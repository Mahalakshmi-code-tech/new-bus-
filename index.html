<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBus | Move Smarter. Travel Better.</title>
    <meta name="description" content="SmartBus connects buses, routes, drivers, and passengers in one kinetic intelligence transportation platform." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8ff" id="meta-theme-color" />

    <!-- Instant Theme Detection Script (Zero-FOUC) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('smartbus-theme');
          // Default to Light mode on first visit or when 'auto' is selected
          const isDark = savedTheme === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
            const meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#0b1120');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            const meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#faf8ff');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Google Fonts: Inter, Space Grotesk, Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background dark:bg-[#0b1120] text-on-surface dark:text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-primary-container selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
